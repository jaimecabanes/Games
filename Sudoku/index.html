
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Sudoku Canadiense de Ani 🍁</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

    :root {
      --red-canada: #C8102E;
      --red-dark: #8A0B1E;
      --cream: #FAF6F0;
      --dark: #1A1A1A;
      --board-border: #2B2D42;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Evita que la pantalla se desplace */
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(180deg, #FFF0F0 0%, #FAF6F0 100%);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
    }

    /* HEADER COMPACTO */
    .header-container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      color: var(--red-canada);
      font-size: clamp(1rem, 4vh, 1.4rem);
      margin: 0;
    }

    .welcome-ani {
      background: var(--red-canada);
      color: white;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: clamp(0.7rem, 2.5vh, 0.85rem);
      font-weight: 700;
      display: inline-block;
      margin-top: 2px;
    }

    /* CONTROLES */
    .controls-panel {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 400px;
      justify-content: center;
    }

    select, button {
      font-family: inherit;
      font-size: clamp(0.75rem, 2.2vh, 0.9rem);
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      border: 2px solid var(--dark);
      cursor: pointer;
    }

    select {
      background-color: white;
      flex: 1;
    }

    .btn-primary {
      background-color: var(--red-canada);
      color: white;
      border-color: var(--red-dark);
      flex: 1;
    }

    .btn-secondary {
      background-color: white;
      color: var(--dark);
      flex: 1;
    }

    /* TABLERO DE SUDOKU AJUSTADO A LA ALTURA DISPONIBLE */
    .sudoku-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .sudoku-container {
      background: var(--board-border);
      padding: 3px;
      border-radius: 10px;
      border: 3px solid var(--red-canada);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      /* Se adapta al ancho o alto de la pantalla, lo que sea menor */
      width: min(88vw, 48vh);
      height: min(88vw, 48vh);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: 100%;
      height: 100%;
      background-color: var(--board-border);
      gap: 1px;
    }

    .cell {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 4.5vw, 1.6rem);
      font-weight: 700;
      cursor: pointer;
    }

    .cell:nth-child(3n) { border-right: 2px solid var(--board-border); }
    .cell:nth-child(9n) { border-right: none; }
    .cell-row-2, .cell-row-5 { border-bottom: 2px solid var(--board-border); }

    .cell.fixed {
      background-color: #F0F2F5;
      color: var(--dark);
    }

    .cell.selected {
      background-color: #FFD2D2 !important;
    }

    .cell.user-entered {
      color: var(--red-canada);
    }

    .cell.error {
      background-color: #FFB3B3;
      color: #B71C1C;
    }

    /* TECLADO NUMÉRICO OPTIMIZADO PARA NO CORTARSE */
    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 400px;
    }

    .num-btn {
      background: white;
      border: 2px solid var(--dark);
      border-radius: 8px;
      height: clamp(38px, 6.5vh, 50px);
      font-size: clamp(1.1rem, 3.5vh, 1.4rem);
      font-weight: 700;
      color: var(--dark);
      box-shadow: 0 2px 0 var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-btn:active {
      transform: translateY(2px);
      box-shadow: none;
      background-color: #FFF0F0;
    }

    .num-btn.erase {
      background: #EAECEE;
      font-size: clamp(0.75rem, 2vh, 0.9rem);
    }

    /* OVERLAY DE VICTORIA */
    .win-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 10px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      z-index: 10;
    }

    .win-overlay h2 {
      color: var(--red-canada);
      font-size: 1.5rem;
      margin: 0 0 10px 0;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>🍁 Sudoku Canadiense 🏔️</h1>
    <div class="welcome-ani">¡Para Ani! 🌲</div>
  </div>

  <div class="controls-panel">
    <select id="difficulty">
      <option value="easy">Fácil 🦌</option>
      <option value="medium" selected>Medio 🐻</option>
      <option value="hard">Difícil 🐺</option>
    </select>
    <button class="btn-primary" onclick="newGame()">Nuevo</button>
    <button class="btn-secondary" onclick="checkSolution()">Comprobar</button>
  </div>

  <div class="sudoku-wrapper">
    <div class="sudoku-container">
      <div class="grid" id="grid"></div>
    </div>

    <div class="win-overlay" id="win-screen">
      <h2>🎉 ¡Increíble, Ani! 🎉</h2>
      <p style="font-size: 0.95rem; font-weight: 600;">¡Has completado todo el tablero canadiense con éxito! 🇨🇦🍁</p>
      <button class="btn-primary" style="padding: 8px 16px; flex: none;" onclick="newGame()">Jugar de Nuevo</button>
    </div>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="inputNumber(1)">1</button>
    <button class="num-btn" onclick="inputNumber(2)">2</button>
    <button class="num-btn" onclick="inputNumber(3)">3</button>
    <button class="num-btn" onclick="inputNumber(4)">4</button>
    <button class="num-btn" onclick="inputNumber(5)">5</button>
    <button class="num-btn" onclick="inputNumber(6)">6</button>
    <button class="num-btn" onclick="inputNumber(7)">7</button>
    <button class="num-btn" onclick="inputNumber(8)">8</button>
    <button class="num-btn" onclick="inputNumber(9)">9</button>
    <button class="num-btn erase" onclick="inputNumber(null)">🗑️ Borrar</button>
  </div>

  <script>
    let solutionBoard = [];
    let initialBoard = [];
    let userBoard = [];
    let selectedCell = null;

    function generateSudoku() {
      let board = Array.from({ length: 9 }, () => Array(9).fill(0));
      solveSudoku(board);
      solutionBoard = JSON.parse(JSON.stringify(board));

      const diff = document.getElementById('difficulty').value;
      let removeCount = diff === 'easy' ? 30 : diff === 'medium' ? 42 : 54;

      let puzzle = JSON.parse(JSON.stringify(board));
      while (removeCount > 0) {
        let r = Math.floor(Math.random() * 9);
        let c = Math.floor(Math.random() * 9);
        if (puzzle[r][c] !== 0) {
          puzzle[r][c] = 0;
          removeCount--;
        }
      }

      initialBoard = JSON.parse(JSON.stringify(puzzle));
      userBoard = JSON.parse(JSON.stringify(puzzle));
    }

    function solveSudoku(board) {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (board[r][c] === 0) {
            let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
            for (let num of nums) {
              if (isValid(board, r, c, num)) {
                board[r][c] = num;
                if (solveSudoku(board)) return true;
                board[r][c] = 0;
              }
            }
            return false;
          }
        }
      }
      return true;
    }

    function isValid(board, r, c, num) {
      for (let i = 0; i < 9; i++) {
        if (board[r][i] === num || board[i][c] === num) return false;
      }
      let startR = Math.floor(r / 3) * 3;
      let startC = Math.floor(c / 3) * 3;
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if (board[startR + i][startC + j] === num) return false;
        }
      }
      return true;
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('win-screen').style.display = 'none';

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (r === 2 || r === 5) cell.classList.add(`cell-row-${r}`);

          const val = userBoard[r][c];
          cell.innerText = val !== 0 ? val : '';

          if (initialBoard[r][c] !== 0) {
            cell.classList.add('fixed');
          } else if (val !== 0) {
            cell.classList.add('user-entered');
          }

          cell.onclick = () => selectCell(r, c, cell);
          grid.appendChild(cell);
        }
      }
    }

    function selectCell(r, c, cellElement) {
      if (initialBoard[r][c] !== 0) return;

      document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
      selectedCell = { r, c, element: cellElement };
      cellElement.classList.add('selected');
    }

    function inputNumber(num) {
      if (!selectedCell) return;

      const { r, c } = selectedCell;
      userBoard[r][c] = num || 0;
      renderBoard();
      
      const newIndex = r * 9 + c;
      const newCell = document.getElementById('grid').children[newIndex];
      selectCell(r, c, newCell);

      checkWin();
    }

    function checkSolution() {
      const cells = document.getElementById('grid').children;
      let errorsFound = false;

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const index = r * 9 + c;
          const userVal = userBoard[r][c];

          if (userVal !== 0 && userVal !== solutionBoard[r][c]) {
            cells[index].classList.add('error');
            errorsFound = true;
          }
        }
      }

      if (!errorsFound) {
        alert("¡Todo perfecto hasta ahora, Ani! 🌲");
      }
    }

    function checkWin() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (userBoard[r][c] !== solutionBoard[r][c]) return;
        }
      }
      document.getElementById('win-screen').style.display = 'flex';
    }

    function newGame() {
      selectedCell = null;
      generateSudoku();
      renderBoard();
    }

    window.onload = newGame;
  </script>
</body>
</html>
