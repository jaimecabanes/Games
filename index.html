<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sudoku Canadiense de Ani 🍁</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

    :root {
      --red-canada: #C8102E;
      --red-dark: #8A0B1E;
      --cream: #FAF6F0;
      --pine: #2D5A27;
      --wood: #D4A373;
      --dark: #2B2D42;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #FFEEEE 0%, #FAF6F0 50%, #E2E8F0 100%);
      color: var(--dark);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-container {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      color: var(--red-canada);
      font-size: 2.2rem;
      margin: 0;
      text-shadow: 2px 2px 0px white, 4px 4px 0px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .welcome-ani {
      background: var(--red-canada);
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 600;
      display: inline-block;
      margin-top: 5px;
      box-shadow: 0 4px 10px rgba(200, 16, 46, 0.3);
    }

    .controls-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select, button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid var(--dark);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select {
      background-color: white;
      color: var(--dark);
    }

    .btn-primary {
      background-color: var(--red-canada);
      color: white;
      border-color: var(--red-dark);
      box-shadow: 0 4px 0 var(--red-dark);
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--red-dark);
    }

    .btn-secondary {
      background-color: white;
      color: var(--dark);
      box-shadow: 0 4px 0 var(--dark);
    }

    .btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--dark);
    }

    /* TABLERO DE SUDOKU */
    .sudoku-container {
      background: white;
      padding: 12px;
      border-radius: 20px;
      border: 4px solid var(--red-canada);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 100%;
      max-width: 450px;
      height: calc(100vw - 60px);
      max-height: 450px;
      border: 3px solid var(--dark);
      background-color: var(--dark);
      gap: 1px;
    }

    .cell {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    /* Bordes gruesos para las regiones de 3x3 */
    .cell:nth-child(3n) { border-right: 2px solid var(--dark); }
    .cell:nth-child(9n) { border-right: none; }
    .cell-row-2, .cell-row-5 { border-bottom: 2px solid var(--dark); }

    .cell.fixed {
      background-color: #F3F4F6;
      color: var(--dark);
      cursor: not-allowed;
    }

    .cell.selected {
      background-color: #FFE3E3 !important;
    }

    .cell.user-entered {
      color: var(--red-canada);
    }

    .cell.error {
      background-color: #FFC9C9;
      color: #D32F2F;
    }

    /* TECLADO NUMÉRICO */
    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 450px;
      margin-top: 15px;
    }

    .num-btn {
      background: white;
      border: 2px solid var(--dark);
      border-radius: 10px;
      padding: 12px 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--dark);
      box-shadow: 0 3px 0 var(--dark);
    }

    .num-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--dark);
    }

    .num-btn.erase {
      background: #E5E7EB;
      grid-column: span 1;
    }

    /* MENSAJE DE VICTORIA */
    .win-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      animation: pop 0.3s ease;
    }

    .win-overlay h2 {
      color: var(--red-canada);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>🍁 Sudoku Canadiense 🏔️</h1>
    <div class="welcome-ani">¡A jugar, Ani! 🌲</div>
  </div>

  <div class="controls-panel">
    <select id="difficulty">
      <option value="easy">Fácil 🦌</option>
      <option value="medium" selected>Medio 🐻</option>
      <option value="hard">Difícil 🐺</option>
    </select>
    <button class="btn-primary" onclick="newGame()">Nuevo Juego</button>
    <button class="btn-secondary" onclick="checkSolution()">Verificar</button>
  </div>

  <div class="sudoku-container">
    <div class="grid" id="grid"></div>
    
    <div class="win-overlay" id="win-screen">
      <h2>🎉 ¡Felicidades, Ani! 🎉</h2>
      <p style="font-size: 1.2rem; font-weight: 600;">¡Has resuelto el Sudoku como una auténtica exploradora canadiense! 🇨🇦🍁</p>
      <button class="btn-primary" onclick="newGame()">Jugar Otra Vez</button>
    </div>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="inputNumber(1)">1</button>
    <button class="num-btn" onclick="inputNumber(2)">2</button>
    <button class="num-btn" onclick="inputNumber(3)">3</button>
    <button class="num-btn" onclick="inputNumber(4)">4</button>
    <button class="num-btn" onclick="inputNumber(5)">5</button>
    <button class="num-btn" onclick="inputNumber(6)">6</button>
    <button class="num-btn" onclick="inputNumber(7)">7</button>
    <button class="num-btn" onclick="inputNumber(8)">8</button>
    <button class="num-btn" onclick="inputNumber(9)">9</button>
    <button class="num-btn erase" onclick="inputNumber(null)">✏️ Borrar</button>
  </div>

  <script>
    let solutionBoard = [];
    let initialBoard = [];
    let userBoard = [];
    let selectedCell = null;

    // Generador de Sudokus válidos
    function generateSudoku() {
      let board = Array.from({ length: 9 }, () => Array(9).fill(0));
      solveSudoku(board);
      solutionBoard = JSON.parse(JSON.stringify(board));

      // Quitar números según la dificultad
      const diff = document.getElementById('difficulty').value;
      let removeCount = diff === 'easy' ? 30 : diff === 'medium' ? 42 : 54;

      let puzzle = JSON.parse(JSON.stringify(board));
      while (removeCount > 0) {
        let r = Math.floor(Math.random() * 9);
        let c = Math.floor(Math.random() * 9);
        if (puzzle[r][c] !== 0) {
          puzzle[r][c] = 0;
          removeCount--;
        }
      }

      initialBoard = JSON.parse(JSON.stringify(puzzle));
      userBoard = JSON.parse(JSON.stringify(puzzle));
    }

    function solveSudoku(board) {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (board[r][c] === 0) {
            let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
            for (let num of nums) {
              if (isValid(board, r, c, num)) {
                board[r][c] = num;
                if (solveSudoku(board)) return true;
                board[r][c] = 0;
              }
            }
            return false;
          }
        }
      }
      return true;
    }

    function isValid(board, r, c, num) {
      for (let i = 0; i < 9; i++) {
        if (board[r][i] === num || board[i][c] === num) return false;
      }
      let startR = Math.floor(r / 3) * 3;
      let startC = Math.floor(c / 3) * 3;
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if (board[startR + i][startC + j] === num) return false;
        }
      }
      return true;
    }

    // Renderizar tablero
    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('win-screen').style.display = 'none';

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (r === 2 || r === 5) cell.classList.add(`cell-row-${r}`);

          const val = userBoard[r][c];
          cell.innerText = val !== 0 ? val : '';

          if (initialBoard[r][c] !== 0) {
            cell.classList.add('fixed');
          } else if (val !== 0) {
            cell.classList.add('user-entered');
          }

          cell.onclick = () => selectCell(r, c, cell);
          grid.appendChild(cell);
        }
      }
    }

    function selectCell(r, c, cellElement) {
      if (initialBoard[r][c] !== 0) return; // No seleccionar celdas fijas

      document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
      selectedCell = { r, c, element: cellElement };
      cellElement.classList.add('selected');
    }

    function inputNumber(num) {
      if (!selectedCell) return;

      const { r, c } = selectedCell;
      userBoard[r][c] = num || 0;
      renderBoard();
      
      // Volver a seleccionar la casilla tras re-renderizar
      const newIndex = r * 9 + c;
      const newCell = document.getElementById('grid').children[newIndex];
      selectCell(r, c, newCell);

      checkWin();
    }

    // Teclado físico
    window.addEventListener('keydown', (e) => {
      if (!selectedCell) return;
      if (e.key >= '1' && e.key <= '9') {
        inputNumber(parseInt(e.key));
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        inputNumber(null);
      }
    });

    function checkSolution() {
      const cells = document.getElementById('grid').children;
      let errorsFound = false;

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const index = r * 9 + c;
          const userVal = userBoard[r][c];

          if (userVal !== 0 && userVal !== solutionBoard[r][c]) {
            cells[index].classList.add('error');
            errorsFound = true;
          }
        }
      }

      if (!errorsFound) {
        alert("¡Vas súper bien Ani, no hay errores por ahora! 🌲");
      }
    }

    function checkWin() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (userBoard[r][c] !== solutionBoard[r][c]) return;
        }
      }
      document.getElementById('win-screen').style.display = 'flex';
    }

    function newGame() {
      selectedCell = null;
      generateSudoku();
      renderBoard();
    }

    window.onload = newGame;
  </script>
</body>
</html>
